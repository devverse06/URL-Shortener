version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: url-shortener-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=url_shortener
    restart: unless-stopped
    networks:
      - url-shortener-network

  redis:
    image: redis:alpine
    container_name: url-shortener-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - url-shortener-network

volumes:
  mongodb_data:
  redis_data:

networks:
  url-shortener-network:
    driver: bridge
